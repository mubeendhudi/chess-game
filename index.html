<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Game</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="app">
        <h1 class="title">Chess Game</h1>

        <div class="layout">
            <!-- Left side: status + board -->
            <section class="board-section">
                <div id="status" class="status" role="status" aria-live="polite">White to move</div>
                <div id="board" class="board" aria-label="Chess board"></div>
            </section>

            <!-- Right side: controls + move history -->
            <aside class="side-panel">
                <div class="panel-header">
                    <h2>Move History</h2>
                    <button id="resetBtn" class="btn">Reset Game</button>
                </div>
                <div id="history" class="history">
                    <p class="empty-note">No moves yet.</p>
                </div>
            </aside>
        </div>
    </main>

    <!-- Promotion dialog (shown when a pawn reaches the last rank) -->
    <div id="promotionModal" class="modal hidden">
        <div class="modal-box">
            <h3>Promote pawn to:</h3>
            <div id="promotionChoices" class="promotion-choices"></div>
        </div>
    </div>

    <!-- chess.js handles all the rules and move validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
